<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ATM人 (ATM Operator)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 外部監視器 -->
  <section id="monitor">
    <div id="hud">
      <span>⏱ <b id="timer">3:00</b></span>
      <span>✅ <b id="hudDone">0</b></span>
      <span>💸 <b id="hudLoss">0</b></span>
      <span>😡 <b id="hudComp">0</b></span>
    </div>
    <div class="rec">● REC CAM 04</div>
    <div id="queue"></div>
    <div id="customer" class="sprite hidden"></div>
    <div id="bubble" class="hidden"></div>
    <div id="mirror">
      <div class="mirror-title">ATM 螢幕</div>
      <div id="mirrorLabel">待機中</div>
      <div id="mirrorValue">----</div>
      <div id="judge" class="hidden">
        <button id="btnV" class="green">V</button>
        <button id="btnX" class="red">X</button>
      </div>
    </div>
  </section>

  <!-- 玩家工作台 -->
  <section id="work">
    <div id="tabs">
      <button class="tab active" data-tab="room">🔧 內部機房</button>
      <button class="tab" data-tab="term">🖥 終端機</button>
    </div>

    <div id="room" class="panel active">
      <div id="cardZone">
        <div id="cardSlot">
          <div id="card" class="hidden"></div>
          <div id="swipeHint" class="hidden">⬆ 上滑卡片推回</div>
          <div id="noCard">（插卡槽空）</div>
        </div>
      </div>
      <div id="cashZone">
        <div id="stacks">
          <button class="bill b1000" data-v="1000">1000</button>
          <button class="bill b100" data-v="100">100</button>
        </div>
        <div id="trayWrap">
          <div id="tray"><div id="trayBills"></div><div id="trayTotal">$0</div></div>
          <div class="row">
            <button id="btnReset" class="mid gray">清空 Reset</button>
            <button id="btnDispense" class="mid gold">確認出鈔</button>
          </div>
        </div>
      </div>
    </div>

    <div id="term" class="panel">
      <div id="crt"><pre id="crtText">BANK TERMINAL v1.0
請輸入卡號後按【查詢卡號】</pre><div id="crtInput">&gt; <span id="inputBuf"></span><span class="cursor">█</span></div></div>
      <div id="termKeys">
        <div id="numpad"></div>
        <div id="funcKeys">
          <button id="btnQuery" class="fk">查詢卡號</button>
          <button id="btnLock" class="fk danger">鎖卡</button>
          <button id="btnAuth" class="fk">提款授權</button>
        </div>
      </div>
    </div>
  </section>

  <div id="toast" class="hidden"></div>

  <!-- 開始畫面 -->
  <div id="startScreen" class="overlay title">
    <div class="title-top">
      <h1>ATM人</h1>
      <p class="sub">ATM Operator</p>
    </div>
    <div class="title-bottom">
      <button id="btnStart" class="big gold">▶ 開始上班（3 分鐘）</button>
      <button id="btnTutorial" class="big gray">📘 新手教學</button>
      <p class="warn">⚠ 系統沒有防呆，所有錯誤照單全收！</p>
    </div>
  </div>

  <!-- 新手教學導引 -->
  <div id="guide" class="hidden">
    <div id="guideStep"></div>
    <div id="guideText"></div>
    <div class="guide-btns">
      <button id="guideExit" class="mid gray">離開教學</button>
      <button id="guideNext" class="mid gold hidden">下一步 ▶</button>
    </div>
  </div>

  <!-- 結算 -->
  <div id="endScreen" class="overlay hidden">
    <div class="box">
      <h2>📋 今日結算報告</h2>
      <div id="rank"></div>
      <div id="rankTitle"></div>
      <div id="fired" class="hidden"></div>
      <table id="stats"></table>
      <div id="newspaper" class="hidden"></div>
      <button id="btnRestart" class="big gold">再上一次班</button>
    </div>
  </div>
</div>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/tutorial.js"></script>
</body>
</html>
